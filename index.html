<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小巴司機月曆排更與薪酬結算系統</title>
  <!-- 引入 SheetJS 用於匯出 Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg-body: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-sub: #f8fafc;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
      
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --accent: #059669;
      --accent-light: #ecfdf5;
      --warning: #d97706;
      --warning-light: #fffbeb;
      --danger: #dc2626;
      --danger-light: #fef2f2;
      
      --cal-empty: #f8fafc;
      --cal-cell-bg: #ffffff;
      --cal-daynum-bg: #e2e8f0;
      
      --holiday-bg: #fee2e2;
      --holiday-border: #fca5a5;
      --holiday-text: #991b1b;
      
      --sat-bg: #fefce8;
      --sat-border: #fef08a;
      --sat-text: #854d0e;
      
      --driver-ky: #2563eb;
      --driver-ky-bg: #eff6ff;
      --driver-yf: #7c3aed;
      --driver-yf-bg: #f5f3ff;
      --driver-wm: #db2777;
      --driver-wm-bg: #fdf2f8;
      --driver-sub: #059669;
      --driver-sub-bg: #ecfdf5;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
    }

    body.dark-mode {
      --bg-body: #090d16;
      --bg-card: #131b2e;
      --bg-card-sub: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #243049;
      
      --primary: #3b82f6;
      --primary-light: #1e293b;
      --accent: #10b981;
      --accent-light: #064e3b;
      --warning: #f59e0b;
      --warning-light: #451a03;
      --danger: #ef4444;
      --danger-light: #450a0a;
      
      --cal-empty: #0c1220;
      --cal-cell-bg: #131b2e;
      --cal-daynum-bg: #243049;
      
      --holiday-bg: #450a0a;
      --holiday-border: #7f1d1d;
      --holiday-text: #fca5a5;
      
      --sat-bg: #352303;
      --sat-border: #713f12;
      --sat-text: #fef08a;
      
      --driver-ky: #60a5fa;
      --driver-ky-bg: #172554;
      --driver-yf: #a78bfa;
      --driver-yf-bg: #2e1065;
      --driver-wm: #f472b6;
      --driver-wm-bg: #500724;
      --driver-sub: #34d399;
      --driver-sub-bg: #064e3b;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; }
    body { background-color: var(--bg-body); margin: 0; padding: 16px; color: var(--text-main); transition: background 0.3s; }
    .container { max-width: 1440px; margin: 0 auto; }

    /* 頂部導航卡片 */
    .card { background: var(--bg-card); border-radius: 14px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow-md); border: 1px solid var(--border-color); }
    .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 18px; }
    .header-title { display: flex; align-items: center; gap: 10px; }
    h1 { font-size: 22px; margin: 0; font-weight: 800; color: var(--text-main); }
    .badge-status { background: var(--accent-light); color: var(--accent); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; border: 1px solid var(--accent); }

    /* 控制面板表單 */
    .control-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 13px; font-weight: 700; color: var(--text-sub); }
    input, select { padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none; background: var(--bg-card-sub); color: var(--text-main); transition: 0.2s; }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }

    /* 按鈕樣式 */
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn { border: none; padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-excel { background: #059669; color: #fff; }
    .btn-excel:hover { background: #047857; }
    .btn-print { background: #475569; color: #fff; }
    .btn-theme { background: var(--bg-card-sub); color: var(--text-main); border: 1px solid var(--border-color); }

    /* 工時檢測警示列 */
    .alert-panel { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 13px; font-weight: 600; }
    .alert-normal { background: var(--accent-light); color: var(--accent); border: 1px solid var(--accent); }
    .alert-warning { background: var(--warning-light); color: var(--warning); border: 1px solid var(--warning); }

    /* 司機薪酬卡片 */
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
    .summary-box { background: var(--bg-card-sub); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; position: relative; overflow: hidden; border-top: 4px solid var(--primary); }
    .summary-box.total-box { border-top-color: var(--accent); background: var(--accent-light); }
    .summary-title { font-size: 16px; font-weight: 800; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .driver-tag-pill { font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: bold; }
    .stat-line { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; color: var(--text-sub); }
    .stat-highlight { font-weight: 700; color: var(--text-main); }
    .stat-money { color: var(--accent); font-weight: 800; font-size: 14px; }

    /* 月曆結構 */
    .calendar-container { overflow-x: auto; }
    .calendar-header { display: grid; grid-template-columns: repeat(7, minmax(160px, 1fr)); gap: 8px; margin-bottom: 8px; text-align: center; }
    .cal-head-cell { background: #1e293b; color: #f8fafc; padding: 10px 0; border-radius: 8px; font-size: 14px; font-weight: 800; }
    .cal-head-cell.sun { background: #b91c1c; }
    .cal-head-cell.sat { background: #b45309; }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(160px, 1fr)); gap: 8px; }
    .cal-cell { background: var(--cal-cell-bg); border: 1px solid var(--border-color); border-radius: 10px; min-height: 185px; padding: 9px; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.2s; cursor: pointer; position: relative; }
    .cal-cell:hover { border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .cal-cell.empty { background: var(--cal-empty); border-style: dashed; cursor: default; }
    .cal-cell.empty:hover { transform: none; box-shadow: none; border-color: var(--border-color); }
    .cal-cell.is-holiday { background: var(--holiday-bg); border-color: var(--holiday-border); }
    .cal-cell.is-sat { background: var(--sat-bg); border-color: var(--sat-border); }

    .cal-date-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .cal-day-num { font-size: 14px; font-weight: 800; color: var(--text-main); background: var(--cal-daynum-bg); width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
    .cal-cell.is-holiday .cal-day-num { background: var(--holiday-border); color: var(--holiday-text); }
    .cal-cell.is-sat .cal-day-num { background: var(--sat-border); color: var(--sat-text); }
    
    .tags-container { display: flex; gap: 4px; align-items: center; }
    .badge-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 800; }
    .badge-edited { background: #fef08a; color: #854d0e; }
    .badge-holiday { background: var(--holiday-border); color: var(--holiday-text); }
    .badge-warn { background: #fee2e2; color: #dc2626; border: 1px solid #f87171; }

    /* 更份項目 */
    .shifts-list { display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
    .shift-card { border-radius: 8px; padding: 6px 8px; font-size: 12px; border-left: 4px solid var(--border-color); background: var(--bg-card-sub); box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
    .shift-card-header { display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 2px; }
    .shift-card-time { font-size: 11px; opacity: 0.85; }

    .shift-ky { border-left-color: var(--driver-ky); background: var(--driver-ky-bg); color: var(--driver-ky); }
    .shift-yf { border-left-color: var(--driver-yf); background: var(--driver-yf-bg); color: var(--driver-yf); }
    .shift-wm { border-left-color: var(--driver-wm); background: var(--driver-wm-bg); color: var(--driver-wm); }
    .shift-sub { border-left-color: var(--driver-sub); background: var(--driver-sub-bg); color: var(--driver-sub); }

    .cal-day-total { margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--border-color); font-size: 11px; display: flex; justify-content: space-between; font-weight: 800; color: var(--text-sub); }
    .edit-hint { font-size: 10px; color: var(--primary); text-align: center; opacity: 0; transition: opacity 0.2s; margin-top: 2px; }
    .cal-cell:hover .edit-hint { opacity: 1; }

    /* 彈窗編輯器 (Modal) */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 999; padding: 16px; }
    .modal-box { background: var(--bg-card); width: 100%; max-width: 520px; border-radius: 16px; padding: 22px; box-shadow: var(--shadow-lg); border: 1px solid var(--border-color); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-title { font-size: 18px; font-weight: 800; margin: 0; color: var(--text-main); }
    .modal-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-sub); }
    
    .modal-shift-box { background: var(--bg-card-sub); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .modal-shift-title { font-size: 14px; font-weight: 800; margin-bottom: 8px; color: var(--primary); display: flex; justify-content: space-between; }
    .modal-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
    .custom-driver-input { display: none; margin-top: 6px; }

    .modal-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; }

    @media print {
      body { background: #fff !important; color: #000 !important; padding: 0; }
      .btn-group, .control-panel, .alert-panel, .edit-hint { display: none !important; }
      .card { box-shadow: none; border: 1px solid #ccc; background: #fff !important; }
      .calendar-grid { grid-template-columns: repeat(7, 1fr); }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 控制與設定面板 -->
  <div class="card control-panel">
    <div class="header-bar">
      <div class="header-title">
        <h1>🚐 小巴司機月曆排更與人工結算系統</h1>
        <span class="badge-status">● 智能工時檢測中</span>
      </div>
      <div class="btn-group">
        <button class="btn btn-theme" id="themeBtn" onclick="toggleTheme()">🌙 深色模式</button>
        <button class="btn btn-excel" onclick="exportToExcel()">📊 匯出高質 Excel</button>
        <button class="btn btn-print" onclick="window.print()">🖨️ 列印報表</button>
      </div>
    </div>

    <div class="control-grid">
      <div class="form-group">
        <label>選擇結算月份</label>
        <input type="month" id="selectMonth" onchange="renderApp()">
      </div>
      <div class="form-group">
        <label>每小時時薪 (HKD)</label>
        <input type="number" id="hourlyRate" value="75" min="1" onchange="renderApp()">
      </div>
      <div class="form-group">
        <label>預設每更小息扣減</label>
        <select id="breakMinutes" onchange="renderApp()">
          <option value="0">0 分鐘 (計足全更)</option>
          <option value="15">15 分鐘</option>
          <option value="30">30 分鐘</option>
          <option value="45">45 分鐘</option>
          <option value="60">60 分鐘 (1小時)</option>
        </select>
      </div>
      <div class="form-group">
        <label>週日/紅日全更結束時間</label>
        <input type="time" id="sunEndTime" value="18:00" onchange="renderApp()">
      </div>
      <div class="form-group">
        <label>首個週六夜更司機</label>
        <select id="firstSatDriver" onchange="renderApp()">
          <option value="黃有嬌">黃有嬌</option>
          <option value="張耀輝">張耀輝</option>
        </select>
      </div>
    </div>

    <!-- 工時檢測警示列 -->
    <div id="alertPanel" class="alert-panel alert-normal">
      <span id="alertMsg">✅ 本月所有班次工時符合安全標準，未檢測到異常工時或超長班次。</span>
      <span style="font-size:11px; opacity:0.8;">💡 提示：點擊任何日期格仔可即時改人名、換替工或調時間</span>
    </div>
  </div>

  <!-- 司機薪酬總結概覽 -->
  <div class="card">
    <div class="summary-grid" id="summaryGrid"></div>
  </div>

  <!-- 月曆排班主體 -->
  <div class="card">
    <div class="calendar-container">
      <div class="calendar-header">
        <div class="cal-head-cell sun">星期日 (Sun)</div>
        <div class="cal-head-cell">星期一 (Mon)</div>
        <div class="cal-head-cell">星期二 (Tue)</div>
        <div class="cal-head-cell">星期三 (Wed)</div>
        <div class="cal-head-cell">星期四 (Thu)</div>
        <div class="cal-head-cell">星期五 (Fri)</div>
        <div class="cal-head-cell sat">星期六 (Sat)</div>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </div>
</div>

<!-- 彈窗編輯器 Modal (點擊格仔更換替工與時間) -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="modalDateTitle">📅 編輯排更與替工</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div id="modalShiftInputs"></div>

    <div class="modal-actions">
      <button class="btn btn-theme" onclick="resetCurrentDay()" style="color:var(--danger)">↺ 還原預設排更</button>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-theme" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="saveDayEdit()">儲存並即時計算</button>
      </div>
    </div>
  </div>
</div>
<script>
  // 2026年香港公眾假期清單
  const HK_HOLIDAYS = {
    "2026-01-01": "元旦", "2026-02-17": "農曆年初一", "2026-02-18": "農曆年初二",
    "2026-02-19": "農曆年初三", "2026-04-03": "耶穌受難節", "2026-04-04": "清明節",
    "2026-04-06": "復活節星期一", "2026-05-01": "勞動節", "2026-05-24": "佛誕",
    "2026-06-19": "端午節", "2026-07-01": "特區紀念日", "2026-09-26": "中秋節翌日",
    "2026-10-01": "國慶日", "2026-10-19": "重陽節", "2026-12-25": "聖誕節", "2026-12-26": "節禮日"
  };

  const DEFAULT_DRIVERS = ['黃有嬌', '張耀輝', '吳惠明'];
  let rosterOverrides = {}; // 記錄手動編輯過的替工或工時
  let currentCalculatedData = [];
  let editingDateStr = null;

  window.onload = function() {
    initTheme();
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    document.getElementById('selectMonth').value = `${yyyy}-${mm}`;
    renderApp();
  };

  function initTheme() {
    const savedTheme = localStorage.getItem('minibusTheme');
    if (savedTheme === 'dark') {
      document.body.classList.add('dark-mode');
      document.getElementById('themeBtn').innerHTML = '☀️ 淺色模式';
    }
  }

  function toggleTheme() {
    const isDark = document.body.classList.toggle('dark-mode');
    localStorage.setItem('minibusTheme', isDark ? 'dark' : 'light');
    document.getElementById('themeBtn').innerHTML = isDark ? '☀️ 淺色模式' : '🌙 深色模式';
  }

  function parseHours(start, end) {
    if (!start || !end) return 0;
    const [sh, sm] = start.split(':').map(Number);
    const [eh, em] = end.split(':').map(Number);
    let diff = (eh + em / 60) - (sh + sm / 60);
    return Math.round(diff * 100) / 100;
  }

  function getDriverClass(name) {
    if (name === '黃有嬌') return 'shift-ky';
    if (name === '張耀輝') return 'shift-yf';
    if (name === '吳惠明') return 'shift-wm';
    return 'shift-sub'; // 自訂替工綠色
  }

  function renderApp() {
    const monthVal = document.getElementById('selectMonth').value;
    if (!monthVal) return;

    const rate = parseFloat(document.getElementById('hourlyRate').value) || 75;
    const breakMin = parseFloat(document.getElementById('breakMinutes').value) || 0;
    const sunEnd = document.getElementById('sunEndTime').value || "18:00";
    let satDriverToggle = document.getElementById('firstSatDriver').value;

    const [year, month] = monthVal.split('-').map(Number);
    const firstDayIndex = new Date(year, month - 1, 1).getDay();
    const totalDays = new Date(year, month, 0).getDate();

    currentCalculatedData = [];
    const stats = {};
    let anomalyCount = 0;

    const calGrid = document.getElementById('calendarGrid');
    calGrid.innerHTML = '';

    // 填充空白月曆格
    for (let i = 0; i < firstDayIndex; i++) {
      const empty = document.createElement('div');
      empty.className = 'cal-cell empty';
      calGrid.appendChild(empty);
    }

    // 逐日計算
    for (let day = 1; day <= totalDays; day++) {
      const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const dateObj = new Date(year, month - 1, day);
      const weekDay = dateObj.getDay();
      const holidayName = HK_HOLIDAYS[dateStr];
      const isHoliday = !!holidayName || weekDay === 0;

      let rowShifts = [];
      let isOverridden = !!rosterOverrides[dateStr];

      if (isOverridden) {
        // 使用手動修改/替工設定
        rowShifts = JSON.parse(JSON.stringify(rosterOverrides[dateStr]));
        if (weekDay === 6 && !isHoliday) {
          satDriverToggle = (satDriverToggle === '黃有嬌') ? '張耀輝' : '黃有嬌';
        }
      } else {
        // 使用系統標準排班規律
        if (isHoliday) {
          rowShifts.push({
            name: '全更',
            driver: '吳惠明',
            start: '08:00',
            end: sunEnd
          });
        } else if (weekDay === 6) {
          rowShifts.push({ name: '早更', driver: '吳惠明', start: '07:00', end: '13:00' });
          rowShifts.push({ name: '夜更', driver: satDriverToggle, start: '13:00', end: '19:00' });
          satDriverToggle = (satDriverToggle === '黃有嬌') ? '張耀輝' : '黃有嬌';
        } else {
          rowShifts.push({ name: '早更', driver: '黃有嬌', start: '06:00', end: '14:00' });
          rowShifts.push({ name: '夜更', driver: '張耀輝', start: '14:00', end: '21:00' });
        }
      }

      // 計算各更工時、人工與工時檢測
      let hasAnomaly = false;
      let dayTotalHours = 0;
      let dayTotalWage = 0;

      rowShifts.forEach(shift => {
        const rawH = parseHours(shift.start, shift.end);
        const netH = Math.max(0, rawH - (breakMin / 60));
        const wage = Math.round(netH * rate);

        shift.rawHours = rawH;
        shift.netHours = netH;
        shift.wage = wage;

        // 工時檢測邏輯 (少於等於0 或 超過10小時)
        if (rawH <= 0 || rawH > 10) {
          hasAnomaly = true;
          anomalyCount++;
        }

        dayTotalHours += netH;
        dayTotalWage += wage;

        // 累積司機個人統計
        if (!stats[shift.driver]) {
          stats[shift.driver] = { h1: 0, h2: 0, totalH: 0, wage1: 0, wage2: 0, totalWage: 0, isSub: !DEFAULT_DRIVERS.includes(shift.driver) };
        }

        if (day <= 15) {
          stats[shift.driver].h1 += netH;
          stats[shift.driver].wage1 += wage;
        } else {
          stats[shift.driver].h2 += netH;
          stats[shift.driver].wage2 += wage;
        }
        stats[shift.driver].totalH += netH;
        stats[shift.driver].totalWage += wage;
      });

      const dayData = {
        date: dateStr,
        dayNum: day,
        weekDayStr: ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][weekDay],
        holidayName: holidayName || (weekDay === 0 ? '週日' : ''),
        isHoliday,
        isOverridden,
        hasAnomaly,
        shifts: rowShifts,
        dailyHours: dayTotalHours,
        dailyWage: dayTotalWage
      };
      currentCalculatedData.push(dayData);

      // 渲染月曆格仔
      const cell = document.createElement('div');
      cell.className = `cal-cell ${isHoliday ? 'is-holiday' : ''} ${weekDay === 6 ? 'is-sat' : ''}`;
      cell.onclick = () => openEditModal(dateStr, dayData);

      let shiftsHtml = rowShifts.map(s => `
        <div class="shift-card ${getDriverClass(s.driver)}">
          <div class="shift-card-header">
            <span>${s.driver} <small>(${s.name})</small></span>
            <span>$${s.wage}</span>
          </div>
          <div class="shift-card-time">
            ${s.start}-${s.end} · <strong>${s.netHours}h</strong>
            ${s.rawHours > 10 ? `<span class="badge-tag badge-warn">⚠️工時長</span>` : ''}
          </div>
        </div>
      `).join('');

      cell.innerHTML = `
        <div>
          <div class="cal-date-bar">
            <span class="cal-day-num">${day}</span>
            <div class="tags-container">
              ${isOverridden ? `<span class="badge-tag badge-edited">已調更/替工</span>` : ''}
              ${holidayName ? `<span class="badge-tag badge-holiday">${holidayName}</span>` : ''}
              ${hasAnomaly ? `<span class="badge-tag badge-warn">異常</span>` : ''}
            </div>
          </div>
          <div class="shifts-list">
            ${shiftsHtml}
          </div>
        </div>
        <div>
          <div class="cal-day-total">
            <span>共 ${dayTotalHours} 小時</span>
            <span class="stat-money">$${dayTotalWage.toLocaleString()}</span>
          </div>
          <div class="edit-hint">✏️ 點擊編輯替工/時間</div>
        </div>
      `;
      calGrid.appendChild(cell);
    }

    renderAlertPanel(anomalyCount);
    renderSummary(stats);
  }

  function renderAlertPanel(anomalies) {
    const panel = document.getElementById('alertPanel');
    const msg = document.getElementById('alertMsg');
    if (anomalies > 0) {
      panel.className = 'alert-panel alert-warning';
      msg.innerHTML = `⚠️ <strong>工時安全提示：</strong>本月檢測到 <strong>${anomalies}</strong> 個班次工時異常或單更超過 10 小時，請點擊對應格仔核對。`;
    } else {
      panel.className = 'alert-panel alert-normal';
      msg.innerHTML = `✅ <strong>工時檢測正常：</strong>本月所有開工班次時數合理，未發現異常或超時情況。`;
    }
  }

  function renderSummary(stats) {
    const container = document.getElementById('summaryGrid');
    container.innerHTML = '';

    let fleetTotalH = 0;
    let fleetTotalW = 0;

    for (const [name, d] of Object.entries(stats)) {
      fleetTotalH += d.totalH;
      fleetTotalW += d.totalWage;

      const box = document.createElement('div');
      box.className = 'summary-box';
      box.innerHTML = `
        <div class="summary-title">
          <span>👤 ${name}</span>
          ${d.isSub ? `<span class="driver-tag-pill" style="background:#ecfdf5; color:#059669; border:1px solid #059669;">替工</span>` : ''}
        </div>
        <div class="stat-line">
          <span>上半月 (1-15號):</span>
          <span class="stat-highlight">${d.h1}h (<span class="stat-money">$${d.wage1.toLocaleString()}</span>)</span>
        </div>
        <div class="stat-line">
          <span>下半月 (16-尾):</span>
          <span class="stat-highlight">${d.h2}h (<span class="stat-money">$${d.wage2.toLocaleString()}</span>)</span>
        </div>
        <hr style="border:0; border-top:1px dashed var(--border-color); margin:8px 0;">
        <div class="stat-line" style="font-size:14px;">
          <span>全月總工時:</span>
          <span class="stat-highlight">${d.totalH} 小時</span>
        </div>
        <div class="stat-line" style="font-size:14px;">
          <span>全月實出人工:</span>
          <span class="stat-money" style="font-size:16px;">$${d.totalWage.toLocaleString()}</span>
        </div>
      `;
      container.appendChild(box);
    }

    // 車隊總結
    const totalBox = document.createElement('div');
    totalBox.className = 'summary-box total-box';
    totalBox.innerHTML = `
      <div class="summary-title" style="color:var(--accent);">
        <span>📊 全車隊總結算</span>
      </div>
      <div class="stat-line" style="margin-top:10px;">
        <span>全月營運日數:</span>
        <span class="stat-highlight">${currentCalculatedData.length} 日</span>
      </div>
      <div class="stat-line">
        <span>全月總營運工時:</span>
        <span class="stat-highlight">${fleetTotalH} 小時</span>
      </div>
      <hr style="border:0; border-top:1px dashed var(--accent); margin:8px 0;">
      <div class="stat-line" style="font-size:15px; margin-top:6px;">
        <span>車隊總人工支出:</span>
        <span class="stat-money" style="font-size:18px;">$${fleetTotalW.toLocaleString()}</span>
      </div>
    `;
    container.appendChild(totalBox);
  }

  // 彈窗編輯器邏輯
  function openEditModal(dateStr, dayData) {
    editingDateStr = dateStr;
    document.getElementById('modalDateTitle').innerHTML = `📅 編輯更份：${dateStr} (${dayData.weekDayStr}) ${dayData.holidayName ? `<small style="color:red">【${dayData.holidayName}】</small>` : ''}`;
    
    const container = document.getElementById('modalShiftInputs');
    container.innerHTML = '';

    dayData.shifts.forEach((shift, index) => {
      const shiftBox = document.createElement('div');
      shiftBox.className = 'modal-shift-box';
      const isDefault = DEFAULT_DRIVERS.includes(shift.driver);
      
      shiftBox.innerHTML = `
        <div class="modal-shift-title">
          <span>${shift.name}</span>
          <span style="font-size:12px; color:var(--text-sub);">原定: ${shift.rawHours}小時</span>
        </div>
        <div class="modal-form-row">
          <div class="form-group">
            <label>開工司機 / 替工</label>
            <select id="modal_driver_sel_${index}" onchange="toggleCustomDriverInput(${index})">
              <option value="黃有嬌" ${shift.driver === '黃有嬌' ? 'selected' : ''}>黃有嬌</option>
              <option value="張耀輝" ${shift.driver === '張耀輝' ? 'selected' : ''}>張耀輝</option>
              <option value="吳惠明" ${shift.driver === '吳惠明' ? 'selected' : ''}>吳惠明</option>
              <option value="CUSTOM" ${!isDefault ? 'selected' : ''}>➕ 手動輸入替工姓名...</option>
            </select>
            <input type="text" id="modal_driver_custom_${index}" class="custom-driver-input" placeholder="請輸入替工姓名" value="${!isDefault ? shift.driver : ''}" style="${!isDefault ? 'display:block;' : 'display:none;'}">
          </div>
          <div class="form-group">
            <label>更份名稱</label>
            <input type="text" id="modal_name_${index}" value="${shift.name}">
          </div>
        </div>
        <div class="modal-form-row">
          <div class="form-group">
            <label>開工時間</label>
            <input type="time" id="modal_start_${index}" value="${shift.start}">
          </div>
          <div class="form-group">
            <label>收工時間</label>
            <input type="time" id="modal_end_${index}" value="${shift.end}">
          </div>
        </div>
      `;
      container.appendChild(shiftBox);
    });

    document.getElementById('editModal').style.display = 'flex';
  }

  function toggleCustomDriverInput(index) {
    const sel = document.getElementById(`modal_driver_sel_${index}`);
    const input = document.getElementById(`modal_driver_custom_${index}`);
    if (sel.value === 'CUSTOM') {
      input.style.display = 'block';
      input.focus();
    } else {
      input.style.display = 'none';
    }
  }

  function saveDayEdit() {
    if (!editingDateStr) return;
    const dayData = currentCalculatedData.find(d => d.date === editingDateStr);
    if (!dayData) return;

    const newShifts = [];
    dayData.shifts.forEach((_, index) => {
      const sel = document.getElementById(`modal_driver_sel_${index}`).value;
      let finalDriver = sel;
      if (sel === 'CUSTOM') {
        finalDriver = document.getElementById(`modal_driver_custom_${index}`).value.trim() || '替工';
      }

      newShifts.push({
        name: document.getElementById(`modal_name_${index}`).value || '更份',
        driver: finalDriver,
        start: document.getElementById(`modal_start_${index}`).value,
        end: document.getElementById(`modal_end_${index}`).value
      });
    });

    rosterOverrides[editingDateStr] = newShifts;
    closeModal();
    renderApp();
  }

  function resetCurrentDay() {
    if (editingDateStr && rosterOverrides[editingDateStr]) {
      delete rosterOverrides[editingDateStr];
    }
    closeModal();
    renderApp();
  }

  function closeModal() {
    document.getElementById('editModal').style.display = 'none';
    editingDateStr = null;
  }

  // 匯出 Excel 報表
  function exportToExcel() {
    const monthVal = document.getElementById('selectMonth').value;
    const breakMin = document.getElementById('breakMinutes').value;

    const exportData = [];
    currentCalculatedData.forEach(item => {
      const s1 = item.shifts[0] || {};
      const s2 = item.shifts[1] || {};

      exportData.push({
        "日期": item.date,
        "星期": item.weekDayStr,
        "假期/備註": item.holidayName || (item.isOverridden ? "已調更/替工" : "-"),
        "扣減小息(分)": breakMin,
        "早更司機": s1.driver || "-",
        "早更時段": s1.start ? `${s1.start}-${s1.end}` : "-",
        "早更實計時數": s1.netHours || 0,
        "早更人工": s1.wage || 0,
        "夜更/全更司機": s2.driver || "-",
        "夜更/全更時段": s2.start ? `${s2.start}-${s2.end}` : "-",
        "夜更實計時數": s2.netHours || 0,
        "夜更人工": s2.wage || 0,
        "當日總工時": item.dailyHours,
        "當日總人工(HKD)": item.dailyWage
      });
    });

    const ws = XLSX.utils.json_to_sheet(exportData);
    ws['!cols'] = [
      { wch: 12 }, { wch: 10 }, { wch: 14 }, { wch: 14 },
      { wch: 14 }, { wch: 14 }, { wch: 12 }, { wch: 12 },
      { wch: 14 }, { wch: 14 }, { wch: 12 }, { wch: 12 },
      { wch: 12 }, { wch: 14 }
    ];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, `排更明細`);
    XLSX.writeFile(wb, `小巴排更薪酬表_${monthVal}.xlsx`);
  }
</script>

</body>
</html>
