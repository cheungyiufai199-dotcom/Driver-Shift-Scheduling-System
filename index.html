<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小巴司機更表系統</title>
    <!-- 引入 Tailwind CSS 樣式 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-between">

    <!-- 頂部標題列 -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">🚐 小巴司機更表系統</h1>
        <div id="user-info" class="hidden flex items-center space-x-3">
            <span id="user-name" class="text-sm font-medium"></span>
            <button id="logout-btn" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm transition">登出</button>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="container mx-auto p-4 flex-grow flex flex-col items-center justify-center">
        
        <!-- 未登入：顯示 Google 登入按鈕 -->
        <div id="login-section" class="bg-white p-8 rounded-xl shadow-lg text-center max-w-md w-full">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">歡迎登入</h2>
            <p class="text-gray-600 mb-6">請使用 Google 帳戶登入以查看本週小巴開工更表。</p>
            <button id="google-login-btn" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 rounded-lg p-3 text-gray-700 font-medium hover:bg-gray-50 shadow-sm transition">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                使用 Google 帳戶登入
            </button>
        </div>

        <!-- 已登入：顯示更表內容 -->
        <div id="schedule-section" class="hidden w-full max-w-4xl bg-white rounded-xl shadow-lg p-6 mt-4">
            <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">📅 小巴司機更表總覽</h2>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-blue-100 text-blue-900">
                            <th class="p-3 border">星期 / 日期</th>
                            <th class="p-3 border">早更時間</th>
                            <th class="p-3 border">早更司機</th>
                            <th class="p-3 border">夜更時間</th>
                            <th class="p-3 border">夜更司機</th>
                        </tr>
                    </thead>
                    <tbody class="text-gray-700">
                        <tr class="hover:bg-gray-50">
                            <td class="p-3 border font-semibold">星期一至五</td>
                            <td class="p-3 border">06:00 - 14:00</td>
                            <td class="p-3 border text-blue-600 font-medium">黃有嬌</td>
                            <td class="p-3 border">14:00 - 21:00</td>
                            <td class="p-3 border text-blue-600 font-medium">張耀輝</td>
                        </tr>
                        <tr class="hover:bg-gray-50">
                            <td class="p-3 border font-semibold">星期六</td>
                            <td class="p-3 border">07:00 - 13:00</td>
                            <td class="p-3 border text-blue-600 font-medium">吳惠明</td>
                            <td class="p-3 border">13:00 - 19:00</td>
                            <td class="p-3 border text-blue-600 font-medium">黃有嬌 / 張耀輝<br><span class="text-xs text-gray-500">(輪流開工)</span></td>
                        </tr>
                        <tr class="hover:bg-gray-50">
                            <td class="p-3 border font-semibold">星期日及公眾假期</td>
                            <td colspan="4" class="p-3 border text-center text-blue-600 font-medium">
                                全更：吳惠明 (時間同星期六)
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="text-center p-4 text-gray-500 text-sm">
        &copy; 2026 小巴車隊管理系統
    </footer>

    <!-- Firebase SDK 邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        // 你的專屬 Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyDyrDNgT6127Kh4J4-ywWrSNnXMy9kaF1g",
            authDomain: "driver-dispatch-4ce63.firebaseapp.com",
            databaseURL: "https://driver-dispatch-4ce63-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "driver-dispatch-4ce63",
            storageBucket: "driver-dispatch-4ce63.firebasestorage.app",
            messagingSenderId: "265548249329",
            appId: "1:265548249329:web:1d146a4322ec796ef01150",
            measurementId: "G-JHSV6SFXGL"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginSection = document.getElementById('login-section');
        const scheduleSection = document.getElementById('schedule-section');
        const userInfo = document.getElementById('user-info');
        const userName = document.getElementById('user-name');
        const googleLoginBtn = document.getElementById('google-login-btn');
        const logoutBtn = document.getElementById('logout-btn');

        // 點擊 Google 登入
        googleLoginBtn.addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .catch((error) => {
                    console.error("登入失敗", error);
                    alert("登入失敗：" + error.message);
                });
        });

        // 點擊登出
        logoutBtn.addEventListener('click', () => {
            signOut(auth).catch((error) => {
                console.error("登出失敗", error);
            });
        });

        // 監聽登入狀態改變
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // 已登入
                loginSection.classList.add('hidden');
                scheduleSection.classList.remove('hidden');
                userInfo.classList.remove('hidden');
                userName.textContent = user.displayName || user.email;
            } else {
                // 未登入
                loginSection.classList.remove('hidden');
                scheduleSection.classList.add('hidden');
                userInfo.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
