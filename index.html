<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小巴司機排更與工資結算系統</title>
  <!-- 引入 SheetJS 用於匯出 Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --primary: #1e40af;
      --primary-light: #dbeafe;
      --holiday-bg: #fee2e2;
      --holiday-text: #991b1b;
      --gray-bg: #f8fafc;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; }
    body { background-color: #f1f5f9; margin: 0; padding: 16px; color: #1e293b; }
    .container { max-width: 1100px; margin: 0 auto; }
    
    .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05); }
    h1, h2, h3 { margin-top: 0; color: #0f172a; }
    
    .control-panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 14px; font-weight: bold; color: #475569; }
    input, select { padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; outline: none; }
    input:focus, select:focus { border-color: var(--primary); }

    .btn-group { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .btn-excel { background: #059669; }
    .btn-excel:hover { background: #047857; }
    
    /* 統計概覽卡片 */
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .summary-box { background: var(--gray-bg); border-radius: 10px; padding: 16px; border: 1px solid var(--border); }
    .summary-box.highlight { border-top: 4px solid var(--primary); }
    .summary-name { font-size: 16px; font-weight: bold; margin-bottom: 8px; color: #1e293b; }
    .stat-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
    .stat-val { font-weight: bold; color: #0f172a; }
    .stat-wage { color: #059669; font-weight: bold; }

    /* 表格樣式 */
    .table-responsive { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; background: #fff; }
    th, td { padding: 12px 10px; border-bottom: 1px solid var(--border); text-align: center; }
    th { background: #f8fafc; font-weight: bold; color: #334155; white-space: nowrap; }
    tr:hover { background: #f8fafc; }
    
    .badge-holiday { background: var(--holiday-bg); color: var(--holiday-text); padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-sat { background: #fef3c7; color: #92400e; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    .tag-driver { display: inline-block; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 13px; margin: 2px 0; }
    .driver-ky { background: #dbeafe; color: #1e40af; } /* 黃有嬌 */
    .driver-yf { background: #e0e7ff; color: #3730a3; } /* 張耀輝 */
    .driver-wm { background: #fce7f3; color: #9d174d; } /* 吳惠明 */
    
    .divider-row { background: #e2e8f0; font-weight: bold; text-align: left; padding: 8px 12px; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>🚐 小巴司機自動排更與工資核算系統</h1>
    <div class="control-panel">
      <div class="form-group">
        <label>選擇年份與月份</label>
        <input type="month" id="selectMonth" onchange="generateRoster()">
      </div>
      <div class="form-group">
        <label>每小時時薪 (HKD)</label>
        <input type="number" id="hourlyRate" value="75" min="0" onchange="generateRoster()">
      </div>
      <div class="form-group">
        <label>週日/紅日全更結束時間</label>
        <input type="time" id="sunEndTime" value="18:00" onchange="generateRoster()">
      </div>
      <div class="form-group">
        <label>首個週六夜更司機 (第一週)</label>
        <select id="firstSatDriver" onchange="generateRoster()">
          <option value="黃有嬌">黃有嬌</option>
          <option value="張耀輝">張耀輝</option>
        </select>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-excel" onclick="exportToExcel()">📊 匯出高質 Excel 報表</button>
    </div>
  </div>

  <!-- 總結數據卡片 -->
  <div class="card">
    <h3>📈 工時與薪酬三階段匯總 (上半月 / 下半月 / 全月)</h3>
    <div class="summary-grid" id="summaryGrid">
      <!-- 統計數據由 JavaScript 動態生成 -->
    </div>
  </div>

  <!-- 詳細排更日曆表記錄 -->
  <div class="card">
    <h3>📋 每日詳細開工與工資表</h3>
    <div class="table-responsive">
      <table id="rosterTable">
        <thead>
          <tr>
            <th>日期</th>
            <th>星期 / 節日</th>
            <th>早更 (司機 / 時間)</th>
            <th>夜更 / 全更 (司機 / 時間)</th>
            <th>當日總工時</th>
            <th>當日總工資支出</th>
          </tr>
        </thead>
        <tbody id="rosterBody">
          <!-- 由 JS 渲染 -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // 香港常見公眾假期列表 (格式: YYYY-MM-DD)
  const HK_HOLIDAYS = {
    "2026-01-01": "元旦", "2026-02-17": "農曆年初一", "2026-02-18": "農曆年初二",
    "2026-02-19": "農曆年初三", "2026-04-03": "耶穌受難節", "2026-04-04": "清明節",
    "2026-04-06": "復活節星期一", "2026-05-01": "勞動節", "2026-05-24": "佛誕",
    "2026-06-19": "端午節", "2026-07-01": "特區紀念日", "2026-09-26": "中秋節翌日",
    "2026-10-01": "國慶日", "2026-10-19": "重陽節", "2026-12-25": "聖誕節", "2026-12-26": "節禮日"
  };

  let currentCalculatedData = [];

  // 初始化設置當前月份
  window.onload = function() {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    document.getElementById('selectMonth').value = `${yyyy}-${mm}`;
    generateRoster();
  };

  function parseHours(start, end) {
    const [sh, sm] = start.split(':').map(Number);
    const [eh, em] = end.split(':').map(Number);
    return (eh + em / 60) - (sh + sm / 60);
  }

  function generateRoster() {
    const monthVal = document.getElementById('selectMonth').value;
    if (!monthVal) return;

    const rate = parseFloat(document.getElementById('hourlyRate').value) || 75;
    const sunEnd = document.getElementById('sunEndTime').value || "18:00";
    let satDriverToggle = document.getElementById('firstSatDriver').value;

    const [year, month] = monthVal.split('-').map(Number);
    const totalDays = new Date(year, month, 0).getDate();

    currentCalculatedData = [];
    const stats = {
      '黃有嬌': { h1: 0, h2: 0, totalH: 0 },
      '張耀輝': { h1: 0, h2: 0, totalH: 0 },
      '吳惠明': { h1: 0, h2: 0, totalH: 0 }
    };

    const tbody = document.getElementById('rosterBody');
    tbody.innerHTML = '';

    for (let day = 1; day <= totalDays; day++) {
      const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const dateObj = new Date(year, month - 1, day);
      const weekDay = dateObj.getDay(); // 0: 日, 1-5: 一至五, 6: 六
      const holidayName = HK_HOLIDAYS[dateStr];
      const isHoliday = !!holidayName || weekDay === 0;

      let rowData = {
        date: dateStr,
        dayNum: day,
        weekDayStr: ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][weekDay],
        holidayName: holidayName || (weekDay === 0 ? '週日' : ''),
        isHoliday: isHoliday,
        mDriver: '', mTime: '', mHours: 0,
        nDriver: '', nTime: '', nHours: 0,
        dailyHours: 0,
        dailyWage: 0
      };

      if (isHoliday) {
        // 星期日 或 公眾假期：全更由吳惠明負責
        const hours = parseHours('08:00', sunEnd);
        rowData.nDriver = '吳惠明';
        rowData.nTime = `08:00 - ${sunEnd} (全更)`;
        rowData.nHours = hours;
        rowData.dailyHours = hours;
      } else if (weekDay === 6) {
        // 星期六：早更吳惠明 (07:00-13:00)，夜更嬌姐/耀輝輪更 (13:00-19:00)
        rowData.mDriver = '吳惠明';
        rowData.mTime = '07:00 - 13:00 (6小時)';
        rowData.mHours = 6;

        rowData.nDriver = satDriverToggle;
        rowData.nTime = '13:00 - 19:00 (6小時)';
        rowData.nHours = 6;
        rowData.dailyHours = 12;

        // 切換下個週六司機
        satDriverToggle = (satDriverToggle === '黃有嬌') ? '張耀輝' : '黃有嬌';
      } else {
        // 星期一至五 (平日)：早更黃有嬌 (06:00-14:00, 8h)，夜更張耀輝 (14:00-21:00, 7h)
        rowData.mDriver = '黃有嬌';
        rowData.mTime = '06:00 - 14:00 (8小時)';
        rowData.mHours = 8;

        rowData.nDriver = '張耀輝';
        rowData.nTime = '14:00 - 21:00 (7小時)';
        rowData.nHours = 7;
        rowData.dailyHours = 15;
      }

      rowData.dailyWage = rowData.dailyHours * rate;
      currentCalculatedData.push(rowData);

      // 累積工時統計 (上半月 1-15 號 / 下半月 16-月尾)
      const isFirstHalf = day <= 15;
      [
        { name: rowData.mDriver, h: rowData.mHours },
        { name: rowData.nDriver, h: rowData.nHours }
      ].forEach(shift => {
        if (shift.name && stats[shift.name]) {
          if (isFirstHalf) stats[shift.name].h1 += shift.h;
          else stats[shift.name].h2 += shift.h;
          stats[shift.name].totalH += shift.h;
        }
      });

      // 渲染表格行
      const tr = document.createElement('tr');
      const badgeHtml = holidayName ? `<span class="badge-holiday">${holidayName}</span>` : (weekDay === 6 ? `<span class="badge-sat">週六</span>` : '');
      const getTagClass = (name) => name === '黃有嬌' ? 'driver-ky' : (name === '張耀輝' ? 'driver-yf' : (name === '吳惠明' ? 'driver-wm' : ''));

      tr.innerHTML = `
        <td><strong>${dateStr}</strong></td>
        <td>${rowData.weekDayStr} ${badgeHtml}</td>
        <td>${rowData.mDriver ? `<span class="tag-driver ${getTagClass(rowData.mDriver)}">${rowData.mDriver}</span><br><small>${rowData.mTime}</small>` : '-'}</td>
        <td>${rowData.nDriver ? `<span class="tag-driver ${getTagClass(rowData.nDriver)}">${rowData.nDriver}</span><br><small>${rowData.nTime}</small>` : '-'}</td>
        <td><strong>${rowData.dailyHours}</strong> 小時</td>
        <td class="stat-wage">$${rowData.dailyWage.toLocaleString()}</td>
      `;
      tbody.appendChild(tr);
    }

    renderSummary(stats, rate);
  }

  function renderSummary(stats, rate) {
    const container = document.getElementById('summaryGrid');
    container.innerHTML = '';

    for (const [name, data] of Object.entries(stats)) {
      const wage1 = data.h1 * rate;
      const wage2 = data.h2 * rate;
      const wageTotal = data.totalH * rate;

      const box = document.createElement('div');
      box.className = 'summary-box highlight';
      box.innerHTML = `
        <div class="summary-name">👤 ${name}</div>
        <div class="stat-row"><span>上半月 (1-15號):</span> <span class="stat-val">${data.h1} 小時 (<span class="stat-wage">$${wage1.toLocaleString()}</span>)</span></div>
        <div class="stat-row"><span>下半月 (16-尾):</span> <span class="stat-val">${data.h2} 小時 (<span class="stat-wage">$${wage2.toLocaleString()}</span>)</span></div>
        <hr style="border:0; border-top:1px dashed #cbd5e1; margin:8px 0;">
        <div class="stat-row" style="font-size:15px;"><span>全月總計:</span> <span class="stat-val">${data.totalH} 小時</span></div>
        <div class="stat-row" style="font-size:15px;"><span>實發總人工:</span> <span class="stat-wage" style="font-size:16px;">$${wageTotal.toLocaleString()}</span></div>
      `;
      container.appendChild(box);
    }
  }

  function exportToExcel() {
    const monthVal = document.getElementById('selectMonth').value;
    const rate = parseFloat(document.getElementById('hourlyRate').value) || 75;
    
    // 構建乾淨的 Excel 數據
    const exportData = currentCalculatedData.map(item => ({
      "日期": item.date,
      "星期": item.weekDayStr,
      "假期備註": item.holidayName,
      "早更司機": item.mDriver || "-",
      "早更時間": item.mTime || "-",
      "早更時數": item.mHours,
      "夜更/全更司機": item.nDriver || "-",
      "夜更/全更時間": item.nTime || "-",
      "夜更時數": item.nHours,
      "當日總工時": item.dailyHours,
      "當日總工資(HKD)": item.dailyWage
    }));

    const ws = XLSX.utils.json_to_sheet(exportData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, `${monthVal} 排更及工資表`);

    XLSX.writeFile(wb, `小巴排更表_${monthVal}.xlsx`);
  }
</script>

</body>
</html>
